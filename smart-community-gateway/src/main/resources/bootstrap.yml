# bootstrap.yml 只放：应用名 + Nacos 连接配置（优先级最高）
spring:
  application:
    name: smart-gateway-service  # 服务名，必须和 Nacos 一致
  cloud:
    #nacos配置
    nacos:
      # 服务注册与发现配置
      discovery:
        server-addr: 192.168.11.223:8848  # Nacos 地址
        username: nacos
        password: nacos
        #locator是自动服务发现和路由功能。
        locator:
          enabled: true  # 关闭服务发现(当 locator.enabled=true 时，
          # Spring Cloud Gateway会自动为所有注册到Nacos的服务创建默认路由，这会绕过您自定义的路由配置和过滤器！)
          #如果 smart-user-service 注册到 Nacos
          #Gateway 会自动创建路由：http://网关地址/smart-user-service/** → lb://smart-user-service
          lower-case-service-id: true
      config: # Nacos 配置
        server-addr: 192.168.11.223:8848
        username: nacos
        password: nacos
        file-extension: yml # 配置文件扩展名
        group: DEFAULT_GROUP # 配置文件分组
    gateway: # 网关配置
      routes: # 路由配置
        - id: smart-user # 路由id，没有实际意义
          uri: lb://smart-user-service #写各个微服务模块的名字（spring.application.name）
          predicates:
            - Path=/user/** # 匹配路径

      # 全局跨域配置
      globalcors:
        cors-configurations:  # 跨域配置
          '[/**]':  # 匹配所有路径
            allowed-origin-patterns: "*"  # 允许所有源
            allowed-methods: "*"  # 允许所有方法
            allowed-headers: "*"  # 允许所有头
            allow-credentials: true  # 允许跨域请求携带凭证
server:
  port: 18000  # 网关端口

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.alibaba.nacos: INFO
